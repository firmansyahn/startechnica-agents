name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skills lint
        env:
          # A regex of names that must never appear in the skills, kept as a repository secret.
          SKILLS_INTERNAL_PATTERNS: ${{ secrets.SKILLS_INTERNAL_PATTERNS }}
        run: node skills/agent-skills-authoring/scripts/lint-skills.mjs
      - name: Scan scripts parse
        run: for f in skills/*/scripts/*.sh; do bash -n "$f"; done
      - name: Manifest versions agree
        run: node -e 'const fs=require("fs");const v=new Set();for(const f of [".claude-plugin/plugin.json",".claude-plugin/marketplace.json",".codex-plugin/plugin.json",".cursor-plugin/plugin.json","gemini-extension.json"]){const j=JSON.parse(fs.readFileSync(f,"utf8"));v.add(j.version??j.metadata.version);for(const p of j.plugins||[])v.add(p.version)}if(v.size!==1){console.error("manifest versions differ: "+[...v].join(", "));process.exit(1)}console.log("version "+[...v][0])'
      - name: Manifests parse
        run: for f in .claude-plugin/*.json .codex-plugin/plugin.json .cursor-plugin/plugin.json gemini-extension.json; do node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"; done
